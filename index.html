<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Something good is on its way.">
  <title>Coming Soon | Myporti</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #17231b;
      background: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff;
    }

    main {
      width: min(100% - 40px, 560px);
      padding: 40px 0;
      text-align: center;
      animation: arrive 700ms ease-out both;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 72px);
      font-weight: 800;
      letter-spacing: -.06em;
      line-height: 1;
    }

    .monkey {
      display: block;
      width: 144px;
      height: 144px;
      margin: 28px auto 18px;
      image-rendering: pixelated;
      animation: float 1.2s ease-in-out infinite;
    }

    .loader {
      width: min(100%, 220px);
      height: 8px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 0;
      background: #e8eee9;
    }

    .loader-fill {
      width: 38%;
      height: 100%;
      background: #36a269;
      animation: loading 1.5s ease-in-out infinite;
    }

    .loader-label {
      margin: 14px 0 0;
      color: #657369;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .loader-label::after {
      content: "...";
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes loading {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(290%); }
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
    <svg class="monkey" viewBox="0 0 18 17" role="img" aria-label="Pixel-art monkey" shape-rendering="crispEdges">
      <g fill="#62483b">
        <rect x="8" y="0" width="1" height="1"/>
        <rect x="6" y="1" width="6" height="1"/>
        <rect x="5" y="2" width="8" height="1"/>
        <rect x="4" y="3" width="10" height="1"/>
        <rect x="3" y="4" width="12" height="1"/>
        <rect x="3" y="5" width="2" height="5"/>
        <rect x="13" y="5" width="2" height="5"/>
        <rect x="5" y="4" width="3" height="1"/>
        <rect x="10" y="4" width="3" height="1"/>
        <rect x="7" y="4" width="3" height="2"/>
        <rect x="4" y="9" width="2" height="1"/>
        <rect x="12" y="9" width="2" height="1"/>
        <rect x="6" y="10" width="6" height="1"/>
        <rect x="6" y="11" width="2" height="3"/>
        <rect x="10" y="11" width="2" height="3"/>
        <rect x="5" y="13" width="3" height="2"/>
        <rect x="10" y="13" width="3" height="2"/>
        <rect x="5" y="15" width="2" height="1"/>
        <rect x="9" y="15" width="2" height="1"/>
        <rect x="12" y="11" width="2" height="1"/>
        <rect x="14" y="10" width="2" height="2"/>
        <rect x="15" y="9" width="1" height="1"/>
      </g>
      <g fill="#e9c995">
        <rect x="2" y="6" width="1" height="2"/>
        <rect x="15" y="6" width="1" height="2"/>
        <rect x="5" y="5" width="8" height="4"/>
        <rect x="6" y="9" width="6" height="1"/>
        <rect x="8" y="4" width="2" height="1"/>
        <rect x="7" y="15" width="1" height="1"/>
        <rect x="10" y="15" width="1" height="1"/>
      </g>
      <g fill="#ffffff">
        <rect x="5" y="6" width="2" height="2"/>
        <rect x="11" y="6" width="2" height="2"/>
      </g>
      <g fill="#111111">
        <rect x="6" y="6" width="1" height="2"/>
        <rect x="11" y="6" width="1" height="2"/>
      </g>
      <rect x="8" y="9" width="2" height="1" fill="#e87b9b"/>
    </svg>
    <div class="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <div class="loader-fill"></div>
    </div>
    <p class="loader-label" aria-hidden="true">Loading</p>
  </main>
</body>
</html>
